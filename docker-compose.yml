services:
  applyr:
    image: larsmikki/applyr:latest
    container_name: applyr
    ports:
      - "3090:3090"
    volumes:
      - applyr-data:/app/data
      - applyr-output:/app/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3090/api/health"]
      interval: 5m
      timeout: 10s
      retries: 3

volumes:
  applyr-data:
  applyr-output:
